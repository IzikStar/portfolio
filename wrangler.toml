name = "portfolio"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Custom domains (both bought on Cloudflare Registrar, so their zones are in this account).
routes = [
  { pattern = "itschakshteren.com", custom_domain = true },
  { pattern = "www.itschakshteren.com", custom_domain = true },
  { pattern = "izikstar.com", custom_domain = true },
  { pattern = "www.izikstar.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
# Run the worker first so it can redirect the secondary domains on every path.
run_worker_first = true

[[kv_namespaces]]
binding = "MEDIA"
id = "d30f95f26d0b475c97a2c6171e2ea1a4"

# Platform data (entries, members, invites). Tables are created by the worker
# on first use (src/db.js), so there is no migration step to run.
[[d1_databases]]
binding = "DB"
database_name = "izikstar-platform"
database_id = "1812a536-0ea5-46b0-bfdf-9536d9baf84e"

# Refresh projects from their sources (GitHub, web pages) every day at 03:00 UTC.
[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true

# Worker Previews (builds of branches other than main). The block is required for
# preview builds; bindings are not inherited, so previews get their own empty KV
# namespace and never touch the live site's media.
[previews]

[[previews.kv_namespaces]]
binding = "MEDIA"
id = "a570d681fd104ef1b2b2e3e679d9be17"

[[previews.d1_databases]]
binding = "DB"
database_name = "izikstar-platform-preview"
database_id = "e6b0e995-5423-4ffa-9021-2acc77e40292"

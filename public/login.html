<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d6b5f'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='serif' font-weight='700'%3EI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="/site.css">
<meta name="theme-color" content="#13110e">
<meta name="robots" content="noindex">
<title>כניסה · יצחק שטרן</title>
</head>
<body>
<header class="bar"><div class="wrap"><a class="mark" href="/">יצחק שטרן</a><nav aria-label="ראשי"><a href="/community">קהילה</a><a href="/cv">קורות חיים</a></nav></div></header>
<main class="wrap narrow">
  <form class="member-form" id="login-form">
    <h1>כניסה לחברי הקהילה</h1>
    <label class="field">שם משתמש
      <input type="text" name="username" required autocomplete="username" dir="auto">
    </label>
    <label class="field">סיסמה
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn primary" type="submit">כניסה</button>
    <p class="msg" id="login-msg" role="status"></p>
    <p class="hint">עוד לא בקהילה? <a href="/join">בקשת הצטרפות</a></p>
  </form>
</main>
<script src="/member.js"></script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ניהול האתר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .admin { max-width: 48rem; padding-block: 2.5rem 4rem; display: grid; gap: 2rem; }
  .admin h1 { font-family: var(--display); font-size: var(--step-3); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem; display: grid; gap: 1rem; }
  .card h2 { font-family: var(--display); font-size: var(--step-2); }
  .card .hint { color: var(--muted); font-size: var(--step--1); }
  label { display: grid; gap: 0.3rem; font-weight: 500; font-size: var(--step--1); }
  label small { color: var(--muted); font-weight: 400; }
  input[type='text'], input[type='password'], input[type='url'], textarea, select {
    font: inherit; font-size: var(--step-0); color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 0.55rem 0.7rem; width: 100%;
  }
  input[type='url'] { direction: ltr; text-align: start; }
  input[type='file'] { font: inherit; font-size: var(--step--1); max-width: 100%; }
  textarea { min-height: 4.5rem; resize: vertical; }
  .row2 { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: 1rem; }
  .check { display: flex; gap: 0.5rem; align-items: center; font-weight: 400; }
  .msg { font-size: var(--step--1); min-height: 1.4em; }
  .msg.err { color: var(--signal); }
  .msg.ok { color: var(--accent); }
  progress { width: 100%; accent-color: var(--accent); }

  .switches { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
  .switch { border: 1px solid var(--line); border-radius: var(--radius); padding: 0.8rem 0.9rem; display: grid; gap: 0.6rem; background: var(--bg); }
  .switch .top { display: flex; align-items: center; gap: 0.75rem; }
  .switch .name { font-weight: 600; }
  .switch .state { margin-inline-start: auto; font-size: 0.8rem; color: var(--muted); }
  .toggle { position: relative; width: 2.6rem; height: 1.5rem; flex: none; }
  .toggle input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .toggle span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background 0.15s; pointer-events: none; }
  .toggle span::after { content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--surface); transition: inset-inline-start 0.15s; }
  .toggle input:checked + span { background: var(--accent); }
  .toggle input:checked + span::after { inset-inline-start: calc(100% - 1.1rem - 3px); }
  .toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .tabs button { font: inherit; font-size: var(--step--1); padding: 0.3rem 0.8rem; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  .tabs button[aria-pressed='true'] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
  .item { border: 1px solid var(--line); border-radius: var(--radius); padding: 0.9rem; display: grid; gap: 0.6rem; background: var(--bg); }
  .item.is-hidden { opacity: 0.65; }
  .item .top { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .item .meta { margin-inline-start: auto; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); direction: ltr; }
  .item .badge { font-size: 0.75rem; border: 1px solid var(--line); border-radius: 999px; padding: 0 0.5rem; color: var(--muted); }
  .item .note { color: var(--muted); white-space: pre-line; }
  .item .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .item .actions .btn { padding: 0.3rem 0.7rem; }
  .item audio, .item video { width: 100%; max-height: 240px; }
  .item a.link { direction: ltr; overflow-wrap: anywhere; font-size: var(--step--1); }
  .btn.danger { color: var(--signal); }
  .btn.danger.confirm { background: var(--signal); color: var(--accent-ink); border-color: var(--signal); }
  .btn[disabled] { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div class="wrap admin">
  <div class="row2">
    <h1>ניהול האתר</h1>
    <a href="/" style="margin-inline-start:auto">לאתר</a>
    <button class="btn" id="logout" type="button" hidden>יציאה</button>
  </div>

  <form class="card" id="login-form" hidden>
    <h2>כניסה</h2>
    <label for="password">סיסמה
      <input type="password" id="password" autocomplete="current-password" required>
    </label>
    <div class="row2"><button class="btn primary" type="submit">כניסה</button></div>
    <p class="msg" id="login-msg" role="status"></p>
  </form>

  <div id="panel" hidden style="display:grid;gap:2rem">
    <form class="card" id="sections-form">
      <h2>מה מוצג באתר</h2>
      <p class="hint">חלק כבוי לא מופיע בכלל, גם לא בתפריט. חלק יצירתי בלי פריטים מוסתר אוטומטית עד שתעלה אליו משהו.</p>
      <ul class="switches" id="switches"></ul>
      <div class="row2"><button class="btn primary" type="submit" id="save-sections">שמירה</button></div>
      <p class="msg" id="sections-msg" role="status"></p>
    </form>

    <form class="card" id="upload-form">
      <h2>הוספת פריט</h2>
      <label for="section">לאיזה חלק
        <select id="section">
          <option value="music">מוזיקה</option>
          <option value="voice">דיבוב</option>
          <option value="sketches">מערכונים</option>
          <option value="writing">כתיבה</option>
        </select>
      </label>
      <label for="title">כותרת
        <input type="text" id="title" maxlength="120" required>
      </label>
      <label for="note">תיאור <small>(לא חובה. בכתיבה אפשר גם קטע קצר מהטקסט)</small>
        <textarea id="note" maxlength="600"></textarea>
      </label>
      <div class="grid2">
        <label for="file">קובץ <small>שמע, וידאו, PDF או תמונה, עד 25MB</small>
          <input type="file" id="file" accept="audio/*,video/*,application/pdf,image/png,image/jpeg,image/webp,image/gif">
        </label>
        <label for="link">או קישור <small>YouTube, Spotify, Drive וכו'</small>
          <input type="url" id="link" placeholder="https://" maxlength="500">
        </label>
      </div>
      <label for="cover">תמונת עטיפה <small>(לא חובה, PNG/JPG/WebP עד 2MB)</small>
        <input type="file" id="cover" accept="image/png,image/jpeg,image/webp">
      </label>
      <label class="check" for="hidden-upload"><input type="checkbox" id="hidden-upload"> להעלות כמוסתר (לא יופיע באתר עד שתציג אותו)</label>
      <progress id="progress" max="100" value="0" hidden></progress>
      <div class="row2"><button class="btn primary" type="submit" id="upload-btn">הוספה</button></div>
      <p class="msg" id="upload-msg" role="status"></p>
    </form>

    <section class="card">
      <h2>הפריטים באתר</h2>
      <div class="tabs" id="tabs" role="group" aria-label="סינון לפי חלק"></div>
      <p class="msg" id="list-msg" role="status"></p>
      <ol class="list" id="list"></ol>
    </section>
  </div>
</div>
<script src="admin.js"></script>
</body>
</html>

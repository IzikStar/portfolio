<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d6b5f'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='serif' font-weight='700'%3EI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="/site.css">
<meta name="theme-color" content="#13110e">
<meta name="robots" content="noindex">
<title>הצטרפות לקהילה · יצחק שטרן</title>
</head>
<body>
<header class="bar"><div class="wrap"><a class="mark" href="/">יצחק שטרן</a><nav aria-label="ראשי"><a href="/community">קהילה</a><a href="/cv">קורות חיים</a></nav></div></header>
<main class="wrap narrow">
  <form class="member-form" id="join-form" novalidate>
    <h1 id="join-title">בקשת הצטרפות</h1>
    <p class="lede" id="join-lede">כתבו כמה מילים על עצמכם ואיך אנחנו מכירים, ככה יהיה לי קל לאשר.</p>
    <label class="field">שם לתצוגה
      <input type="text" name="displayName" maxlength="60" autocomplete="name" dir="auto">
    </label>
    <label class="field">שם משתמש <small>3 עד 30 אותיות, ספרות, נקודה, מקף או קו תחתון</small>
      <input type="text" name="username" required minlength="3" maxlength="30" autocomplete="username" dir="auto">
    </label>
    <label class="field">סיסמה <small>לפחות 8 תווים</small>
      <input type="password" name="password" required minlength="8" autocomplete="new-password">
    </label>
    <label class="field" id="note-field">כמה מילים עליכם
      <textarea name="note" rows="3" maxlength="600" dir="auto"></textarea>
    </label>
    <label class="hp" aria-hidden="true">Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    <button class="btn primary" type="submit">שליחה</button>
    <p class="msg" id="join-msg" role="status"></p>
    <p class="hint">כבר בקהילה? <a href="/login">כניסה</a></p>
  </form>
  <div id="join-done" hidden>
    <h1>הבקשה נשלחה</h1>
    <p class="lede">אעבור עליה בקרוב. אחרי שאאשר, נכנסים עם שם המשתמש והסיסמה שבחרתם.</p>
  </div>
</main>
<script src="/member.js"></script>
</body>
</html>
